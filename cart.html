<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | Velvet Vogue</title>
    <link rel="stylesheet" href="./cart.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Poppins:wght@200;300;400;500;600;700&family=Italiana&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="cursor-ring" id="cursorRing"></div>
    <div class="cursor-dot" id="cursorDot"></div>

    <!-- Theme Toggle -->
    <button class="theme-toggle" id="themeToggle">
        <i class="fas fa-sun" id="themeIcon"></i>
    </button>

    <nav class="navbar" id="navbar">
        <a href="index.html" class="brand">Velvet Vogue</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="categories.html">Categories</a></li>
            <li><a href="index.html#about">About</a></li>
            <li><a href="index.html#contact">Contact</a></li>
        </ul>
        <div class="nav-icons">
            <i class="fas fa-search"></i>
            <i class="far fa-heart"></i>
            <div class="cart-icon">
                <i class="fas fa-shopping-bag"></i>
                <span class="cart-count" id="cartCount">0</span>
            </div>
        </div>
    </nav>
        <section class="cart-header">
        <div class="cart-header-bg"></div>
        <div class="cart-header-overlay"></div>
        <div class="cart-particles" id="cartParticles"></div>
        
        <div class="cart-header-content">
            <p class="cart-header-tag">✦ Your Selection ✦</p>
            <h1 class="cart-header-title">
                Shopping
                <span class="cart-header-italic">Cart</span>
            </h1>
            <p class="cart-header-subtitle">
                Review your selected luxury pieces and complete your order.
            </p>
            
            <!-- Breadcrumb -->
            <div class="breadcrumb">
                <a href="index.html"><i class="fas fa-home"></i> Home</a>
                <i class="fas fa-chevron-right"></i>
                <span class="active">Shopping Cart</span>
            </div>
        </div>
    </section>
    <script src="./cart.js"></script>
</body>
</html>
