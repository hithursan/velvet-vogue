<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories | Velvet Vogue</title>
    <link rel="stylesheet" href="./categories.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Poppins:wght@200;300;400;500;600;700&family=Italiana&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

        <!-- Custom Cursor -->
    <div class="cursor-ring" id="cursorRing"></div>
    <div class="cursor-dot" id="cursorDot"></div>

    <!-- Theme Toggle -->
    <button class="theme-toggle" id="themeToggle">
        <i class="fas fa-sun" id="themeIcon"></i>
    </button>

        <nav class="navbar" id="navbar">
        <a href="index.html" class="brand" style="text-decoration: none;">Velvet Vogue</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="categories.html" class="active">Categories</a></li>
            <li><a href="index.html#about">About</a></li>
            <li><a href="index.html#contact">Contact</a></li>
        </ul>
        <div class="nav-icons">
            <i class="fas fa-search" id="searchToggle"></i>
            <a href="#" style="text-decoration: none; color: inherit;">
                <i class="far fa-heart"></i>
            </a>
            <a href="cart.html" class="cart-icon" style="text-decoration: none; color: inherit;">
                <i class="fas fa-shopping-bag"></i>
                <span class="cart-count" id="cartCount">0</span>
            </a>
        </div>
    </nav>
        <section class="cat-hero">
        <div class="cat-hero-bg"></div>
        <div class="cat-hero-overlay"></div>
        <div class="cat-particles" id="catParticles"></div>
        
        <div class="cat-hero-content">
            <p class="cat-hero-tag">✦ Curated Excellence ✦</p>
            <h1 class="cat-hero-title">
                Explore Our
                <span class="cat-hero-italic">Collections</span>
            </h1>
            <p class="cat-hero-subtitle">
                Refined styles curated for every occasion. Discover timeless elegance in every piece.
            </p>
            
            <!-- Breadcrumb -->
            <div class="breadcrumb">
                <a href="index.html">Home</a>
                <i class="fas fa-chevron-right"></i>
                <span>Categories</span>
            </div>
        </div>
    </section>
        <section class="search-section">
        <div class="search-container">
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search for luxury products...">
                <button class="search-clear" id="searchClear">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
    </section>

    <script src="./categories.js"></script>
</body>
</html>
