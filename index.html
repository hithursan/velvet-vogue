<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velvet Vogue</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Poppins:wght@200;300;400;500;600;700&family=Italiana&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
	<div class="cursor-ring" id="cursorRing"></div>
    <div class="cursor-dot" id="cursorDot"></div>
    <div class="cursor-text" id="cursorText">VIEW</div>

    <div class="loader" id="loader">
        <div class="loader-curtain left"></div>
        <div class="loader-curtain right"></div>
        <div class="loader-content">
            <h1 class="loader-brand">VELVET</h1>
            <h2 class="loader-script">Vogue</h2>
            <div class="loader-line"></div>
            <p class="loader-percent" id="loaderPercent">0%</p>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
